<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <header class="bb-header">
      <div class="header-top">
        <a href="../../index.html" class="logo" style="text-decoration: none; color: white;">BestTech</a>

        <div class="search-container">
          <input
            type="text"
            id="search-input"
            placeholder="What are you looking for today?"
          />
          <button class="search-btn">
            <!-- Icon kính lúp SVG -->
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </div>

        <div class="nav-actions">
          <div class="nav-item" id="login-trigger">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
            <span>Account</span>
          </div>

          <!-- BTN Order History -->
          <div class="nav-item" id="order-history-trigger" style="display: none;">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
              <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
            <span>Orders</span>
          </div>

          <div class="cart-trigger" id="open-cart">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
              <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
            </svg>
            <span>Cart</span>
            <span class="badge" id="cart-count">0</span>
          </div>
        </div>
      </div>

      <div id="menu-overlay" class="menu-overlay"></div>

      <nav class="header-bottom">
        <div class="menu-pill-container">
          <button class="menu-pill-btn" data-target="dropdown-shop">Shop <span class="arrow">▼</span></button>
          <button class="menu-pill-btn" data-target="dropdown-deals">Deals <span class="arrow">▼</span></button>
          <button class="menu-pill-btn" data-target="dropdown-support">Support & Services <span class="arrow">▼</span></button>
          <button class="menu-pill-btn" data-target="dropdown-discover">Discover <span class="arrow">▼</span></button>
        </div>
      </nav>
    </header>
  
  
  <!-- 2. NỘI DUNG CHÍNH CỦA TRANG DANH MỤC -->
  <main class="shop-layout" style="padding: 40px; max-width: 1600px; margin: 0 auto; display: block;">
    
    <div style="margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
      <h1 id="page-title" style="color: #0046be; font-size: 2rem; margin: 0;">Loading Category...</h1>
    </div>

    <div id="product-list" class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    </div>

  </main>


  <!-- 3. DÁN TOÀN BỘ <footer> ... </footer> TỪ TRANG INDEX.HTML VÀO ĐÂY -->


  <!-- ========================================== -->
  <!-- THIS IS THE KEY: DECLARING PAGE DATA -->
  <!-- ========================================== -->
  <script>
    // Chỉ cần thay đổi 2 biến này khi copy sang trang mới!
    const PAGE_TITLE = "Laptops & Desktops"; 
    const PAGE_KEYWORD = "laptop"; // Hệ thống sẽ tìm các sản phẩm có chữ "laptop"
  </script>
  <script src="app.js"></script>
</body>
</html>
