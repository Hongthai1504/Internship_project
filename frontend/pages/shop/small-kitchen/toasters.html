<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <!-- IMPORTANT: Adjust the relative path depending on folder depth -->
  <link rel="stylesheet" href="/css/client/style.css" />
</head>
<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  

  <!-- MAIN CATEGORY CONTENT -->
  <div class="shop-layout" style="padding: 40px; max-width: 1600px; margin: 0 auto; display: flex; gap: 40px;">
    
    <!-- SIDEBAR FILTER -->
    <aside class="sidebar" style="width: 250px; flex-shrink: 0;">
      
      <!-- SORT OPTIONS -->
      <div class="filter-group" style="margin-bottom: 25px; background: #fff; padding: 20px; border: 1px solid #c8c8c8; border-radius: 8px;">
        <h3 class="filter-title" style="margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; color: #040c13;">Sort By</h3>
        <select id="sort-options" style="width: 100%; padding: 10px; border: 1px solid #c8c8c8; border-radius: 4px; font-size: 1rem; outline: none; cursor: pointer; color: #040c13;">
          <option value="default">Featured (Default)</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>

      <!-- STATIC PRICE FILTER -->
      <div class="filter-group" style="margin-bottom: 25px; background: #fff; padding: 20px; border: 1px solid #c8c8c8; border-radius: 8px;">
        <h3 class="filter-title" style="margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; color: #040c13;">Price Range</h3>
        <ul class="filter-list" style="list-style: none; padding: 0; margin: 0; line-height: 2;">
          <li><label style="cursor: pointer; display: flex; align-items: center; gap: 8px;"><input type="radio" name="price" value="all" checked /> All Prices</label></li>
          <li><label style="cursor: pointer; display: flex; align-items: center; gap: 8px;"><input type="radio" name="price" value="under500" /> Under $500</label></li>
          <li><label style="cursor: pointer; display: flex; align-items: center; gap: 8px;"><input type="radio" name="price" value="500to999" /> $500 - $999</label></li>
          <li><label style="cursor: pointer; display: flex; align-items: center; gap: 8px;"><input type="radio" name="price" value="over1000" /> $1000 & Above</label></li>
        </ul>
      </div>

    </aside>

    <!-- CONTENT AREA -->
    <main class="content-area" style="flex: 1;">
      <div style="margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
        <h1 id="page-title" style="color: #0046be; font-size: 2rem; margin: 0;">Loading Category...</h1>
      </div>
      
      <!-- PRODUCT GRID -->
      <div id="product-list" class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
      </div>
    </main>
    
  </div>

  <!-- PRODUCT DETAIL VIEW (MODERN UI & REVIEWS) -->
  <section id="product-detail-view" class="product-detail-view" style="display: none;">
    <div class="container" style="max-width: 1400px; margin: 40px auto; padding: 0 40px;">
      
      <button id="back-to-shop" class="back-link" data-i18n="btn_back_results" style="background: none; border: none; color: var(--bb-blue); font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-bottom: 25px; transition: opacity 0.2s;">
        ← Back to Results
      </button>
      
      <!-- Main Detail Card -->
      <div class="detail-grid" style="display: flex; gap: 60px; background: #fff; padding: 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 70, 190, 0.05); border: none;">
        <div class="detail-media" style="flex: 1; display: flex; flex-direction: column; gap: 20px;">
          <div style="border-radius: 16px; padding: 40px; text-align: center; background: #f8fafc; position: relative; border: none;">
            <img id="detail-img" src="" alt="Product" style="width: 100%; max-width: 400px; height: 400px; object-fit: contain; display: block; margin: 0 auto; transition: opacity 0.2s ease-in-out;" />
          </div>
          <div id="detail-thumbnails" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;"></div>
        </div>
        
        <div class="detail-info" style="flex: 1;">
          <p id="detail-brand" style="color: var(--bb-blue); font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;"></p>
          <h1 id="detail-name" style="font-size: 2.2rem; color: #0f172a; margin-bottom: 15px; font-weight: 800; line-height: 1.3;">Product Name</h1>
          <p style="color: #64748b; font-size: 0.95rem;"><strong>SKU:</strong> <span id="detail-sku">N/A</span></p>
          <hr style="border-top: 1px solid #e2e8f0; margin: 25px 0;" />
          <p id="detail-price" style="font-size: 2.8rem; font-weight: 900; color: #0f172a; margin-bottom: 25px;">$0.00</p>

          <div class="purchase-box" style="background: #f8fafc; padding: 30px; border-radius: 16px; border: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
            <p style="margin-bottom: 20px; font-weight: bold; font-size: 1.1rem;"><span id="detail-stock">In Stock</span></p>
            <div style="display: flex; gap: 15px;">
              <input type="number" id="qty-input" value="1" min="1" style="width: 80px; text-align: center; font-size: 1.2rem; border: 1px solid #e2e8f0; border-radius: 50px; outline: none; background: #fff; font-weight: 600; color: #0f172a;" />
              <button id="detail-add-btn" data-i18n="btn_add_cart" style="flex: 1; background: var(--bb-yellow); color: #000; border: none; font-weight: 800; font-size: 1.1rem; padding: 15px; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 224, 0, 0.3); transition: all 0.2s ease;">Add to Cart</button>
            </div>
          </div>

          <div style="margin-top: 35px;">
            <h3 data-i18n="detail_about" style="font-size: 1.3rem; margin-bottom: 12px; color: #0f172a;">About this item</h3>
            <p id="detail-desc" style="color: #475569; line-height: 1.7; font-size: 1.05rem;"></p>
          </div>
          
          <div id="detail-specs-container" class="specs-table-wrapper" style="display: none;">
              <h3 data-i18n="detail_specs" style="font-size: 1.5rem; margin-top: 45px; margin-bottom: 20px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;">Technical Specifications</h3>
              <div id="detail-specs-content"></div>
          </div>
        </div>
      </div>

      <!-- Reviews Section -->
      <div class="reviews-section" style="margin-top: 50px; background: #fff; padding: 50px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 70, 190, 0.05); border: none;">
          <h2 data-i18n="detail_reviews" style="font-size: 2rem; color: #0f172a; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; font-weight: 800;">Customer Reviews</h2>

          <div id="review-form-container" style="background: #f8fafc; padding: 30px; border-radius: 16px; margin-bottom: 40px; border: 1px solid #e2e8f0;">
              <h3 data-i18n="review_write" style="margin-top: 0; font-size: 1.3rem; color: var(--bb-blue); margin-bottom: 15px;">Write a Review</h3>
              <p id="review-login-prompt" style="color: #64748b; font-style: italic; margin-bottom: 0;">Please <a href="/pages/user/login.html" style="color: var(--bb-blue); font-weight: bold; text-decoration: none;">Sign In</a> to write a review.</p>
              
              <form id="product-review-form" style="display: none;">
                  <div style="margin-bottom: 20px;">
                      <label data-i18n="review_rating" style="font-weight: 600; display: block; margin-bottom: 8px; color: #0f172a;">Rating *</label>
                      <select id="review-rating" required style="padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; width: 200px; font-size: 1rem; outline: none; background: #fff;">
                          <option value="">Select rating</option>
                          <option value="5">★★★★★ (5/5)</option>
                          <option value="4">★★★★☆ (4/5)</option>
                          <option value="3">★★★☆☆ (3/5)</option>
                          <option value="2">★★☆☆☆ (2/5)</option>
                          <option value="1">★☆☆☆☆ (1/5)</option>
                      </select>
                  </div>
                  <div style="margin-bottom: 20px;">
                      <label data-i18n="review_comment" style="font-weight: 600; display: block; margin-bottom: 8px; color: #0f172a;">Comment</label>
                      <textarea id="review-comment" rows="4" data-i18n-placeholder="review_placeholder" placeholder="Share your experience with this product..." style="width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 1rem; outline: none; resize: vertical;"></textarea>
                  </div>
                  <div style="margin-bottom: 25px;">
                      <label style="font-weight: 600; display: block; margin-bottom: 8px; color: #0f172a;">Upload Image (Optional)</label>
                      <input type="file" id="review-image" accept="image/*" style="width: 100%; padding: 12px; border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; cursor: pointer; font-size: 0.95rem; color: #64748b; transition: border-color 0.2s;">
                  </div>
                  <button type="submit" data-i18n="btn_submit_review" style="background: var(--bb-yellow); color: #000; border: none; padding: 14px 35px; font-weight: 800; font-size: 1.05rem; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 224, 0, 0.3); transition: all 0.2s ease;">Submit Review</button>
              </form>
          </div>
          <div id="reviews-list"><p style="color: #64748b; font-style: italic;">Loading reviews...</p></div>
      </div>
    </div>
  </section>

  <!-- CART DR-->
    <div id="cart-placeholder"></div>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #fff; padding: 40px; width: 400px; border-radius: 8px; position: relative;">
      <button id="close-modal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #555;">&times;</button>
      <div style="display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 2px solid #eee;">
        <h2 id="tab-login" style="margin: 0; cursor: pointer; color: #0046be; border-bottom: 3px solid #0046be; padding-bottom: 10px; font-size: 1.5rem;">Sign In</h2>
        <h2 id="tab-register" style="margin: 0; cursor: pointer; color: #999; padding-bottom: 10px; font-size: 1.5rem;">Register</h2>
      </div>
      <form id="login-form">
        <input type="email" id="login-email" required placeholder="Email Address" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <input type="password" id="login-password" required placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <button type="submit" style="width: 100%; padding: 15px; background: #0046be; color: white; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; border-radius: 4px;">Sign In</button>
      </form>
      <form id="register-form" style="display: none;">
        <input type="text" id="reg-name" required placeholder="Full Name" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <input type="tel" id="reg-phone" placeholder="Phone Number" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <input type="email" id="reg-email" required placeholder="Email Address" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <input type="password" id="reg-password" required placeholder="Password (min 6 chars)" minlength="6" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #c8c8c8; border-radius: 4px;" />
        <button type="submit" style="width: 100%; padding: 15px; background: #ffe000; color: #000; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; border-radius: 4px;">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ORDER HISTORY MODAL -->
  <div id="order-history-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #fff; padding: 40px; width: 800px; max-height: 80vh; overflow-y: auto; border-radius: 8px; position: relative;">
      <button id="close-history-modal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #555;">&times;</button>
      <h2 style="margin-bottom: 25px; color: #0046be; border-bottom: 2px solid #eee; padding-bottom: 10px;">My Order History</h2>
      <div id="order-history-list"></div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profile-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: #fff; padding: 40px; width: 500px; border-radius: 8px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <button id="close-profile-modal" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #555;">&times;</button>
      <h2 style="margin-bottom: 25px; color: #0046be; border-bottom: 2px solid #eee; padding-bottom: 10px;">My Profile</h2>
      <form id="profile-form">
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Email Address <span style="font-weight: normal; color: #888; font-size: 0.9rem;">(Read-only)</span></label>
          <input type="email" id="profile-email" disabled style="width: 100%; padding: 12px; border: 1px solid #c8c8c8; border-radius: 4px; background: #f4f6f9; color: #666; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Full Name</label>
          <input type="text" id="profile-name" required style="width: 100%; padding: 12px; border: 1px solid #c8c8c8; border-radius: 4px; font-size: 1rem;">
        </div>
        <div style="margin-bottom: 30px;">
          <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">Phone Number</label>
          <input type="tel" id="profile-phone" placeholder="Enter your phone number" style="width: 100%; padding: 12px; border: 1px solid #c8c8c8; border-radius: 4px; font-size: 1rem;">
        </div>
        <button type="submit" style="width: 100%; padding: 15px; background: #ffe000; color: #000; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; border-radius: 4px; transition: background 0.2s;">Save Changes</button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <!-- AI CHATBOT UI -->
  <div id="chatbot-placeholder"></div>

<div id="footer-placeholder"></div>

  <!-- THIS IS THE KEY: DECLARING PAGE DATA -->
  <script>
    // Just modify these two variables when creating a new category page!
    const PAGE_TITLE = "Toasters & Toaster Ovens"; 
    const PAGE_KEYWORD = "toasters"; 
  </script>
  <!-- IMPORTANT: Adjust the relative path depending on folder depth -->
  <script src="/js/core/translations.js"></script>
<script>
      async function loadComponents() {
        const components = [
          { id: 'header-placeholder', url: '/components/header.html' },
          { id: 'cart-placeholder', url: '/components/cart.html' },
          { id: 'compare-placeholder', url: '/components/compare.html' },
          { id: 'chatbot-placeholder', url: '/components/chatbot.html' },
          { id: 'footer-placeholder', url: '/components/footer.html' }
        ];

        try {
            await Promise.all(components.map(async (cmp) => {
              const el = document.getElementById(cmp.id);
              if (el) {
                const res = await fetch(cmp.url);
                if (res.ok) {
                    el.innerHTML = await res.text();
                }
              }
            }));

            const script = document.createElement('script');
            script.src = '/js/core/app.js';
            
            script.onload = () => {
                if (typeof applyLanguage === 'function' && typeof currentLang !== 'undefined') {
                    applyLanguage(currentLang);
                }
            };

            document.body.appendChild(script);

        } catch (error) {
            console.error("Lỗi khi tải hệ thống giao diện:", error);
        }
      }

      loadComponents();
    </script>
</body>
</html>
