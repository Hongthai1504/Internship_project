<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category | Best Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/client/style.css" />
    <style>
      /* Định dạng riêng cho Grid của Category để không bị dính CSS trang chủ */
      .category-exclusive-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 25px;
        width: 100%;
      }
      .cat-product-card {
        background: #fff;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cat-product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        border-color: #cbd5e1;
      }
    </style>
  </head>
  <body style="background-color: #f4f7fb">
    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- MAIN SHOP LAYOUT -->
    <div class="shop-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar glass-card" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); border: 1px solid rgba(255, 255, 255, 0.5);">
        
        <!-- LỌC THEO GIÁ -->
        <div class="filter-group" style="margin-bottom: 25px">
          <h3 style="color: #0f172a; font-weight: 900; margin-bottom: 15px; font-size: 1.1rem;">Price Range</h3>
          <ul style="list-style: none; padding: 0; line-height: 2.2; color: #475569; font-weight: 600;">
            <li><label style="cursor: pointer;"><input type="radio" name="price" value="all" checked style="margin-right: 8px;" /> All Prices</label></li>
            <li><label style="cursor: pointer;"><input type="radio" name="price" value="under500" style="margin-right: 8px;" /> Under $500</label></li>
            <li><label style="cursor: pointer;"><input type="radio" name="price" value="500to1000" style="margin-right: 8px;" /> $500 - $1000</label></li>
            <li><label style="cursor: pointer;"><input type="radio" name="price" value="over1000" style="margin-right: 8px;" /> Over $1000</label></li>
          </ul>
        </div>
      </aside>

      <!-- CONTENT AREA -->
      <main class="content-area">
        <!-- TIÊU ĐỀ DANH MỤC ĐỘNG -->
        <div style="padding: 10px 0; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px;">
          <h1 id="page-title" style="color: #0046be; margin: 0; font-size: 2.2rem; font-weight: 900;">
            Loading Category...
          </h1>
        </div>

        <!-- GRID SẢN PHẨM (ĐÃ ĐỔI ID ĐỂ TRÁNH XUNG ĐỘT) -->
        <div id="category-product-container" class="category-exclusive-grid">
          <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
            <div style="font-size: 2.5rem; animation: spin 1s linear infinite;">⚙️</div>
            <p style="color: #64748b; margin-top: 15px; font-weight: bold;">Loading top tier technology...</p>
          </div>
        </div>
      </main>
    </div>

    <!-- CÁC COMPONENT ẨN -->
    <div id="cart-placeholder"></div>
    <div id="compare-placeholder"></div>
    <div id="chatbot-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script src="/js/core/translations.js"></script>
    <script>
      async function loadComponents() {
        const components = [
          { id: "header-placeholder", url: "/pages/components/header.html" },
          { id: "cart-placeholder", url: "/pages/components/cart.html" },
          { id: "compare-placeholder", url: "/pages/components/compare.html" },
          { id: "chatbot-placeholder", url: "/pages/components/chatbot.html" },
          { id: "footer-placeholder", url: "/pages/components/footer.html" },
        ];

        try {
          await Promise.all(
            components.map(async (cmp) => {
              const el = document.getElementById(cmp.id);
              if (el) {
                const res = await fetch(cmp.url);
                if (res.ok) el.innerHTML = await res.text();
              }
            }),
          );

          // Tải app.js trước
          const appScript = document.createElement("script");
          appScript.src = "/js/core/app.js";

          appScript.onload = () => {
            if (typeof applyLanguage === "function" && typeof currentLang !== "undefined") {
              applyLanguage(currentLang);
            }
            // Tải category.js sau cùng để tránh bị app.js ghi đè
            const catScript = document.createElement("script");
            catScript.src = "/js/client/category.js";
            document.body.appendChild(catScript);
          };

          document.body.appendChild(appScript);
        } catch (error) {
          console.error("Lỗi khi tải hệ thống:", error);
        }
      }
      loadComponents();
    </script>
  </body>
</html>
