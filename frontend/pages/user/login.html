<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In or Create Account | Best Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/client/style.css" />
  </head>
  <body style="background-color: #f4f6f9;">
    
    <!-- MINIMAL HEADER FOR AUTH PAGE -->
    <header class="bb-header" style="padding: 20px 0; text-align: center; border-bottom: 4px solid #ffe000;">
      <a href="index.html" class="logo" style="text-decoration: none; color: white; font-size: 2.5rem;">BestTech</a>
      <script src="https://accounts.google.com/gsi/client" async defer></script>
    </header>

    <!-- AUTHENTICATION WRAPPER -->
    <main class="auth-page-wrapper">
      
      <!-- SIGN IN VIEW -->
      <div class="auth-card" id="login-view">
        <h1>Sign In to BestTech</h1>
        <form id="login-form">
          <div class="form-group">
            <input type="text" id="login-email" class="auth-input" required placeholder="Email Address or Mobile Phone Number" />
          </div>
          <div class="form-group">
            <input type="password" id="login-password" class="auth-input" required placeholder="Password" />
          </div>
          
          <button type="submit" class="btn-auth-primary">Sign In</button>
          
          <div class="auth-divider" style="margin: 25px 0;"><span>OR</span></div>

          <div id="g_id_onload"
              data-client_id="MÃ_CLIENT_ID_CỦA_BẠN.apps.googleusercontent.com"
              data-context="signin"
              data-ux_mode="popup"
              data-callback="handleGoogleResponse"
              data-auto_prompt="false">
          </div>
          
          <div class="g_id_signin"
              data-type="standard"
              data-shape="rectangular"
              data-theme="outline"
              data-text="signin_with"
              data-size="large"
              data-logo_alignment="center"
              style="display: flex; justify-content: center; margin-bottom: 15px;">
          </div>
          <button type="button" class="btn-social">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" width="18" style="margin-bottom: 2px;">
            Sign in with Apple
          </button>
        </form>

        <div class="auth-switch" style="margin-top: 25px;">
          Don't have an account? <a href="javascript:void(0)" id="go-to-register">Create an account</a>
        </div>
      </div>

      <!-- REGISTER VIEW (Hidden by default) -->
      <div class="auth-card" id="register-view" style="display: none;">
        <h1>Create an Account</h1>
        <p style="color: #555; margin-bottom: 25px; text-align: center;">Join BestTech to track orders, save items, and more.</p>
        <form id="register-form">
          <div class="form-group">
            <input type="text" id="reg-name" class="auth-input" required placeholder="Full Name" />
          </div>
          <div class="form-group">
            <input type="tel" id="reg-phone" class="auth-input" placeholder="Mobile Phone Number (Optional)" />
          </div>
          <div class="form-group">
            <input type="email" id="reg-email" class="auth-input" required placeholder="Email Address" />
          </div>
          <div class="form-group">
            <input type="password" id="reg-password" class="auth-input" required placeholder="Password (min 6 chars)" minlength="6" />
          </div>
          <button type="submit" class="btn-auth-primary" style="background: #ffe000; color: #000;">Create Account</button>
        </form>

        <div class="auth-switch" style="margin-top: 30px;">
          Already have an account? <a href="javascript:void(0)" id="go-to-login">Sign In</a>
        </div>
      </div>

    </main>

    <!-- MINIMAL FOOTER -->
    <footer style="text-align: center; padding: 40px 20px; color: #666; font-size: 0.9rem;">
      <p>&copy; 2026 Best Tech. All rights reserved. Secure Authentication System.</p>
    </footer>

    <script src="/js/core/app.js"></script>
  </body>
</html>
