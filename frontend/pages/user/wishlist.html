<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist | Best Tech</title>
    <!-- Đồng bộ font Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/client/style.css" />
  </head>
  <body style="background-color: #f4f7fb;">

    <!-- Khung chứa linh kiện hệ thống -->
    <div id="header-placeholder"></div>

    <!-- MAIN WISHLIST LAYOUT -->
    <div class="shop-layout" style="margin-top: 40px;">
      <!-- SIDEBAR FILTER (Tuỳ chọn: Nếu Wishlist ít SP có thể ẩn đi bằng CSS) -->
      <aside class="sidebar glass-card" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); border: 1px solid rgba(255, 255, 255, 0.5);">
        
        <!-- SORT OPTIONS -->
        <div class="filter-group" style="margin-bottom: 25px">
          <h3 class="filter-title" data-i18n="filter_sort" style="color: #0f172a; font-weight: 800; margin-bottom: 15px">Sort By</h3>
          <select id="sort-options" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; outline: none; background: #f8fafc; font-family: inherit;">
            <option value="default" data-i18n="sort_default">Featured (Default)</option>
            <option value="price-asc" data-i18n="sort_low_high">Price: Low to High</option>
            <option value="price-desc" data-i18n="sort_high_low">Price: High to Low</option>
          </select>
        </div>

        <!-- DYNAMIC BRAND FILTER -->
        <div class="filter-group" style="margin-bottom: 25px">
          <h3 class="filter-title" data-i18n="filter_brand" style="color: #0f172a; font-weight: 800; margin-bottom: 15px">Brand</h3>
          <ul class="filter-list" id="brand-filters" style="list-style: none; padding: 0; line-height: 2">
            <p style="color: #64748b; font-size: 0.9rem; font-style: italic" data-i18n="filter_loading_brands">Loading brands...</p>
          </ul>
        </div>

        <!-- STATIC PRICE FILTER -->
        <div class="filter-group">
          <h3 class="filter-title" data-i18n="filter_price" style="color: #0f172a; font-weight: 800; margin-bottom: 15px">Price Range</h3>
          <ul class="filter-list" style="list-style: none; padding: 0; line-height: 2">
            <li><label><input type="radio" name="price" value="all" checked style="margin-right: 8px;" /> <span data-i18n="price_all">All Prices</span></label></li>
            <li><label><input type="radio" name="price" value="under500" style="margin-right: 8px;" /> <span data-i18n="price_under500">Under $500</span></label></li>
            <li><label><input type="radio" name="price" value="500to999" style="margin-right: 8px;" /> <span data-i18n="price_500to999">$500 - $999</span></label></li>
            <li><label><input type="radio" name="price" value="over1000" style="margin-right: 8px;" /> <span data-i18n="price_over1000">$1000 & Above</span></label></li>
          </ul>
        </div>
      </aside>

      <!-- CONTENT AREA -->
      <main class="content-area">          
        
        <!-- TIÊU ĐỀ TRANG -->
        <div style="padding: 10px 0; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px;">
          <h1 style="color: #0046be; margin: 0; font-size: 2.2rem; font-weight: 900;" data-i18n="nav_saved">
            My Wishlist
          </h1>
        </div>

        <!-- KHUNG SẢN PHẨM WISHLIST -->
        <div id="wishlist-page-container" class="product-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 50px;">
                <div style="font-size: 2.5rem; animation: spin 1s linear infinite;">⚙️</div>
                <p style="color: #64748b; margin-top: 15px; font-weight: bold;">Loading your favorite items...</p>
            </div>
        </div>

      </main>
    </div>

    <!-- CÁC COMPONENT ẨN -->
    <section id="product-detail-view" class="product-detail-view" style="display: none;"></section>
    <div id="cart-placeholder"></div>
    <div id="compare-placeholder"></div>
    <div id="chatbot-placeholder"></div>
    <div id="footer-placeholder"></div>

    <!-- HỆ THỐNG SCRIPT -->
    <script src="/js/core/translations.js"></script>
    <script>
      async function loadComponents() {
        const components = [
          { id: "header-placeholder", url: "/pages/components/header.html" },
          { id: "cart-placeholder", url: "/pages/components/cart.html" },
          { id: "compare-placeholder", url: "/pages/components/compare.html" },
          { id: "chatbot-placeholder", url: "/pages/components/chatbot.html" },
          { id: "footer-placeholder", url: "/pages/components/footer.html" },
        ];

        try {
          await Promise.all(
            components.map(async (cmp) => {
              const el = document.getElementById(cmp.id);
              if (el) {
                const res = await fetch(cmp.url);
                if (res.ok) el.innerHTML = await res.text();
              }
            }),
          );

          // Tải app.js trước
          const appScript = document.createElement("script");
          appScript.src = "/js/core/app.js";

          appScript.onload = () => {
            if (typeof applyLanguage === "function" && typeof currentLang !== "undefined") {
              applyLanguage(currentLang);
            }
            
            // Xử lý nạp dữ liệu Wishlist ngay khi App.js khởi tạo xong
            if (typeof renderWishlistPage === "function") {
                renderWishlistPage();
            } else {
                console.warn("Lệnh renderWishlistPage chưa có sẵn trong app.js.");
            }
          };

          document.body.appendChild(appScript);
        } catch (error) {
          console.error("Lỗi khi tải hệ thống giao diện:", error);
        }
      }
      loadComponents();
    </script>
  </body>
</html>
