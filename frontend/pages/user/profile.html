<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Best Tech</title>
    <!-- Font mềm mại, hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/client/style.css"> 

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { 
            background-color: #f4f7fb; /* Tông nền pastel */
            font-family: 'Nunito', sans-serif; 
            margin: 0; 
            color: #1e293b;
        }

        /* HEADER HIỆN ĐẠI */
        .profile-header { 
            background: linear-gradient(135deg, #0046be 0%, #001e50 100%);
            color: white; 
            padding: 20px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0, 70, 190, 0.15);
        }
        .profile-header a { 
            color: #ffe000; 
            text-decoration: none; 
            font-weight: 800; 
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 50px;
        }
        .profile-header a:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); }

        .profile-container { 
            max-width: 1100px; 
            margin: 50px auto; 
            display: flex; 
            gap: 40px; 
            padding: 0 20px; 
        }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        .profile-sidebar { 
            width: 280px; 
            padding: 30px; 
            height: fit-content; 
        }
        
        .profile-main { 
            flex: 1; 
            padding: 40px 50px; 
            min-height: 500px;
        }

        /* UI INPUT BO GÓC MỀM MẠI */
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block; 
            font-weight: 800; 
            color: #0f172a; 
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .input-field { 
            width: 100%; 
            padding: 15px 20px; 
            background: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            outline: none; 
            font-size: 1rem; 
            font-family: inherit;
            box-sizing: border-box; 
            transition: all 0.3s ease; 
        }
        .input-field:focus { 
            background: #ffffff;
            border-color: #0046be; 
            box-shadow: 0 0 0 4px rgba(0, 70, 190, 0.1);
        }

        /* NÚT BẤM GRADIENT */
        .btn-primary {
            background: linear-gradient(135deg, #ffe000 0%, #ffc107 100%);
            color: #000;
            font-weight: 900;
            font-family: inherit;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(255, 193, 7, 0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* TABS MỀM MẠI */
        .tab-btn { 
            padding: 15px 20px; 
            border-radius: 12px; 
            font-weight: 800; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tab-btn.active { background: #f0f4fc; color: #0046be; }
        .tab-btn:not(.active) { color: #64748b; }
        .tab-btn:not(.active):hover { background: #f8fafc; transform: translateX(5px); }
        
        .section-title {
            margin-top: 0; 
            color: #0f172a; 
            border-bottom: 2px dashed #e2e8f0; 
            padding-bottom: 20px; 
            margin-bottom: 35px;
            font-size: 1.8rem;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <header class="profile-header">
        <h1 style="margin:0; font-size: 2rem; font-weight: 900; letter-spacing: -0.5px;">BestTech</h1>
        <a href="/index.html" data-i18n="prof_back_home">← Back to Home</a>
    </header>

    <div class="profile-container">
        <!-- Sidebar -->
        <aside class="profile-sidebar glass-card">
            <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 35px; padding-bottom: 25px; border-bottom: 1px solid #e2e8f0;">
                <div id="prof-avatar" style="width: 65px; height: 65px; background: linear-gradient(135deg, #0046be, #3b82f6); color: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.8rem; box-shadow: 0 8px 15px rgba(0,70,190,0.2);">U</div>
                <div>
                    <div id="prof-name-display" style="font-weight: 900; color: #0f172a; font-size: 1.2rem; margin-bottom: 4px;">Loading...</div>
                    <div style="color: #64748b; font-size: 0.9rem; font-weight: 600;" data-i18n="prof_my_account">My Account</div>
                </div>
            </div>
            
            <div id="tab-info-btn" class="tab-btn active">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span data-i18n="prof_tab_info">Personal Info</span>
            </div>
            <div id="tab-address-btn" class="tab-btn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span data-i18n="prof_tab_address">Address Book</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="profile-main glass-card">
            
            <!-- SECTION 1: PERSONAL INFO -->
            <section id="section-info">
                <h2 class="section-title" data-i18n="prof_title">Personal Information</h2>
                
                <form id="profile-update-form" style="max-width: 600px;">
                    <div class="input-group">
                        <label><span data-i18n="prof_email">Email Address</span> <small style="color:#94a3b8; font-weight:600;" data-i18n="prof_readonly">(Read-only)</small></label>
                        <input type="email" id="prof-email" readonly class="input-field" style="background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: transparent;">
                    </div>
                    
                    <div class="input-group">
                        <label data-i18n="prof_fullname">Full Name</label>
                        <input type="text" id="prof-name" required class="input-field">
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 40px;">
                        <label data-i18n="prof_phone">Phone Number</label>
                        <input type="text" id="prof-phone" data-i18n-placeholder="prof_phone_ph" placeholder="Enter your phone number" class="input-field">
                    </div>
                    
                    <button type="submit" id="btn-save" class="btn-primary" data-i18n="prof_save">Save Changes</button>
                </form>
            </section>

            <!-- SECTION 2: ADDRESS BOOK -->
            <section id="section-address" style="display: none;">
                <h2 class="section-title" data-i18n="prof_addr_title">Address Book</h2>
                
                <!-- Danh sách địa chỉ -->
                <div id="address-list" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;">
                    <p style="color: #64748b; font-style: italic;">Loading addresses...</p>
                </div>

                <!-- Form thêm địa chỉ mới -->
                <div class="add-address-box" style="border: 1px dashed #cbd5e1; padding: 20px; border-radius: 12px; margin-top: 15px;">
                    <h4 style="margin-top: 0; color: #0f172a; margin-bottom: 15px;" data-i18n="prof_add_new_addr">+ Add New Address</h4>
                    
                    <!-- 1. Thanh tìm kiếm địa chỉ -->
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="map-search-input" data-i18n-placeholder="prof_map_search_ph" placeholder="Enter address..." style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
                        <button type="button" id="btn-find-map" style="background: #facc15; color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s;">
                            <span data-i18n="prof_map_search_btn">🔍 Find on Map</span>
                        </button>
                    </div>

                    <!-- 2. Khung hiển thị Bản đồ -->
                    <div id="address-map" style="height: 250px; width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; z-index: 1;"></div>

                    <!-- 3. Khóa ô nhập liệu cuối cùng -->
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="final-validated-address" readonly data-i18n-placeholder="prof_map_pin_ph" placeholder="Pin location on map..." style="flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #10b981; background: #ecfdf5; color: #065f46; font-weight: bold; outline: none;">
                        
                        <button type="button" id="btn-save-address" data-i18n="prof_save_addr_btn" style="background: #0046be; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer;">Save Address</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts (Giữ nguyên Logic API) -->
    <script src="/js/core/translations.js"></script>
    <script src="/js/core/app.js"></script>
    <script src="/js/client/profile.js"></script>
    <script>
        if (typeof translations !== 'undefined') {
            if (!translations.en) translations.en = {};
            if (!translations.vi) translations.vi = {};

            translations.en.prof_add_new_addr = "+ Add New Address";
            translations.vi.prof_add_new_addr = "+ Thêm địa chỉ mới";
            translations.en.prof_map_search_ph = "Enter address (Ex: 144 Xuan Thuy...)";
            translations.vi.prof_map_search_ph = "Nhập địa chỉ (VD: 144 Xuân Thủy...)";
            translations.en.prof_map_search_btn = "🔍 Find on Map";
            translations.vi.prof_map_search_btn = "🔍 Tìm Bản Đồ";
            translations.en.prof_map_pin_ph = "Pin location on map to validate address...";
            translations.vi.prof_map_pin_ph = "Ghim vị trí trên bản đồ để xác thực...";
            translations.en.prof_save_addr_btn = "Save Address";
            translations.vi.prof_save_addr_btn = "Lưu Địa Chỉ";
        }
    </script>
</body>
</html>
