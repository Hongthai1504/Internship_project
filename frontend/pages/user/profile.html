<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Best Tech</title>
    <!-- Font mềm mại, hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/client/style.css"> 
    <style>
        body { 
            background-color: #f4f7fb; /* Tông nền pastel */
            font-family: 'Nunito', sans-serif; 
            margin: 0; 
            color: #1e293b;
        }

        /* HEADER HIỆN ĐẠI */
        .profile-header { 
            background: linear-gradient(135deg, #0046be 0%, #001e50 100%);
            color: white; 
            padding: 20px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0, 70, 190, 0.15);
        }
        .profile-header a { 
            color: #ffe000; 
            text-decoration: none; 
            font-weight: 800; 
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 50px;
        }
        .profile-header a:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); }

        .profile-container { 
            max-width: 1100px; 
            margin: 50px auto; 
            display: flex; 
            gap: 40px; 
            padding: 0 20px; 
        }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        .profile-sidebar { 
            width: 280px; 
            padding: 30px; 
            height: fit-content; 
        }
        
        .profile-main { 
            flex: 1; 
            padding: 40px 50px; 
            min-height: 500px;
        }

        /* UI INPUT BO GÓC MỀM MẠI */
        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block; 
            font-weight: 800; 
            color: #0f172a; 
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .input-field { 
            width: 100%; 
            padding: 15px 20px; 
            background: #f8fafc;
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            outline: none; 
            font-size: 1rem; 
            font-family: inherit;
            box-sizing: border-box; 
            transition: all 0.3s ease; 
        }
        .input-field:focus { 
            background: #ffffff;
            border-color: #0046be; 
            box-shadow: 0 0 0 4px rgba(0, 70, 190, 0.1);
        }

        /* NÚT BẤM GRADIENT */
        .btn-primary {
            background: linear-gradient(135deg, #ffe000 0%, #ffc107 100%);
            color: #000;
            font-weight: 900;
            font-family: inherit;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(255, 193, 7, 0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* TABS MỀM MẠI */
        .tab-btn { 
            padding: 15px 20px; 
            border-radius: 12px; 
            font-weight: 800; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tab-btn.active { background: #f0f4fc; color: #0046be; }
        .tab-btn:not(.active) { color: #64748b; }
        .tab-btn:not(.active):hover { background: #f8fafc; transform: translateX(5px); }
        
        .section-title {
            margin-top: 0; 
            color: #0f172a; 
            border-bottom: 2px dashed #e2e8f0; 
            padding-bottom: 20px; 
            margin-bottom: 35px;
            font-size: 1.8rem;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <header class="profile-header">
        <h1 style="margin:0; font-size: 2rem; font-weight: 900; letter-spacing: -0.5px;">BestTech</h1>
        <a href="/index.html" data-i18n="prof_back_home">← Back to Home</a>
    </header>

    <div class="profile-container">
        <!-- Sidebar -->
        <aside class="profile-sidebar glass-card">
            <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 35px; padding-bottom: 25px; border-bottom: 1px solid #e2e8f0;">
                <div id="prof-avatar" style="width: 65px; height: 65px; background: linear-gradient(135deg, #0046be, #3b82f6); color: #fff; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.8rem; box-shadow: 0 8px 15px rgba(0,70,190,0.2);">U</div>
                <div>
                    <div id="prof-name-display" style="font-weight: 900; color: #0f172a; font-size: 1.2rem; margin-bottom: 4px;">Loading...</div>
                    <div style="color: #64748b; font-size: 0.9rem; font-weight: 600;" data-i18n="prof_my_account">My Account</div>
                </div>
            </div>
            
            <div id="tab-info-btn" class="tab-btn active">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span data-i18n="prof_tab_info">Personal Info</span>
            </div>
            <div id="tab-address-btn" class="tab-btn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span data-i18n="prof_tab_address">Address Book</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="profile-main glass-card">
            
            <!-- SECTION 1: PERSONAL INFO -->
            <section id="section-info">
                <h2 class="section-title" data-i18n="prof_title">Personal Information</h2>
                
                <form id="profile-update-form" style="max-width: 600px;">
                    <div class="input-group">
                        <label><span data-i18n="prof_email">Email Address</span> <small style="color:#94a3b8; font-weight:600;" data-i18n="prof_readonly">(Read-only)</small></label>
                        <input type="email" id="prof-email" readonly class="input-field" style="background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: transparent;">
                    </div>
                    
                    <div class="input-group">
                        <label data-i18n="prof_fullname">Full Name</label>
                        <input type="text" id="prof-name" required class="input-field">
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 40px;">
                        <label data-i18n="prof_phone">Phone Number</label>
                        <input type="text" id="prof-phone" data-i18n-placeholder="prof_phone_ph" placeholder="Enter your phone number" class="input-field">
                    </div>
                    
                    <button type="submit" id="btn-save" class="btn-primary" data-i18n="prof_save">Save Changes</button>
                </form>
            </section>

            <!-- SECTION 2: ADDRESS BOOK -->
            <section id="section-address" style="display: none;">
                <h2 class="section-title" data-i18n="prof_addr_title">Address Book</h2>
                
                <!-- Danh sách địa chỉ -->
                <div id="address-list" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;">
                    <p style="color: #64748b; font-style: italic;">Loading addresses...</p>
                </div>

                <!-- Form thêm địa chỉ mới -->
                <div style="background: #f8fafc; padding: 25px; border-radius: 16px; border: 1px dashed #cbd5e1;">
                    <h3 style="margin-top: 0; font-size: 1.1rem; color: #1e293b; margin-bottom: 15px; font-weight: 800;" data-i18n="prof_addr_add_new">+ Add New Address</h3>
                    <form id="add-address-form" style="display: flex; gap: 15px;">
                        <input type="text" id="new-address-input" required class="input-field" data-i18n-placeholder="prof_addr_placeholder" placeholder="Enter new shipping address...">
                        <button type="submit" style="background: #0046be; color: white; border: none; padding: 0 30px; border-radius: 12px; font-weight: 900; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 15px rgba(0,70,190,0.2); transition: all 0.3s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'" data-i18n="prof_addr_save">Save Address</button>
                    </form>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts (Giữ nguyên Logic API) -->
    <script src="/js/core/translations.js"></script>
    <script src="/js/core/app.js"></script>
    <script>
        // --- CHUYỂN TAB LOGIC ---
        const tabInfo = document.getElementById("tab-info-btn");
        const tabAddr = document.getElementById("tab-address-btn");
        const secInfo = document.getElementById("section-info");
        const secAddr = document.getElementById("section-address");

        tabInfo.addEventListener("click", () => {
            tabInfo.classList.add("active");
            tabAddr.classList.remove("active");
            secInfo.style.display = "block";
            secAddr.style.display = "none";
        });

        tabAddr.addEventListener("click", () => {
            tabAddr.classList.add("active");
            tabInfo.classList.remove("active");
            secAddr.style.display = "block";
            secInfo.style.display = "none";
            fetchAddresses(); 
        });

        // --- KHỞI TẠO TRANG ---
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) { window.location.href = "/pages/user/login.html"; return; }

            if (typeof applyLanguage === 'function' && typeof currentLang !== 'undefined') {
                applyLanguage(currentLang);
            }

            try {
                const res = await fetch("http://localhost:3000/api/profile", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem("token");
                    window.location.href = "/pages/user/login.html";
                    return;
                }

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("prof-email").value = data.email;
                    document.getElementById("prof-name").value = data.full_name;
                    document.getElementById("prof-phone").value = data.phone || '';
                    document.getElementById("prof-name-display").innerText = data.full_name;
                    document.getElementById("prof-avatar").innerText = data.full_name.charAt(0).toUpperCase();
                }
            } catch (error) { console.error("Lỗi tải Profile:", error); }
        });

        // --- UPDATE THÔNG TIN CÁ NHÂN ---
        document.getElementById("profile-update-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("token");
            const full_name = document.getElementById("prof-name").value.trim();
            const phone = document.getElementById("prof-phone").value.trim();
            const submitBtn = document.getElementById("btn-save");
            
            submitBtn.disabled = true;
            submitBtn.innerText = currentLang === 'vi' ? "Đang lưu..." : "Saving...";

            try {
                const res = await fetch("http://localhost:3000/api/profile", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ full_name, phone })
                });

                const result = await res.json();
                if (res.ok) {
                    alert(result.message);
                    document.getElementById("prof-name-display").innerText = full_name;
                    document.getElementById("prof-avatar").innerText = full_name.charAt(0).toUpperCase();
                } else {
                    alert("Lỗi: " + result.error);
                }
            } catch (err) {
                alert(currentLang === 'vi' ? "Lỗi kết nối máy chủ" : "Server connection error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = currentLang === 'vi' ? "Lưu thay đổi" : "Save Changes";
            }
        });

        // --- ADDRESS BOOK LOGIC (GIAO DIỆN MỚI) ---
        async function fetchAddresses() {
            const token = localStorage.getItem("token");
            const listEl = document.getElementById("address-list");
            
            try {
                const res = await fetch("http://localhost:3000/api/profile/addresses", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const addresses = await res.json();
                    
                    if (addresses.length === 0) {
                        listEl.innerHTML = `<p style="color: #64748b; font-style: italic; background: #fff; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0;" data-i18n="prof_addr_empty">No addresses found. Add one below!</p>`;
                        applyLanguage(currentLang);
                        return;
                    }
                    
                    // CARD ĐỊA CHỈ NỔI BẬT
                    listEl.innerHTML = addresses.map(addr => `
                        <div style="border: ${addr.is_default ? '2px solid #0046be' : '1px solid #e2e8f0'}; background: ${addr.is_default ? 'linear-gradient(to right, #f0f4fc, #ffffff)' : '#fff'}; padding: 25px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.2s ease;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='none'">
                            <div style="flex: 1; padding-right: 20px;">
                                <p style="margin: 0 0 10px 0; color: #0f172a; font-size: 1.1rem; line-height: 1.5; font-weight: 600;">${addr.address}</p>
                                ${addr.is_default ? `<span style="background: #0046be; color: white; font-size: 0.75rem; padding: 5px 10px; border-radius: 6px; font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,70,190,0.3);" data-i18n="prof_addr_default">Default</span>` : ''}
                            </div>
                            <div style="display: flex; gap: 10px;">
                                ${!addr.is_default ? `<button onclick="setDefaultAddress(${addr.id})" style="background: #eef2f7; color: #0046be; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.85rem; transition: 0.2s;" onmouseover="this.style.background='#dbeafe'" onmouseout="this.style.background='#eef2f7'" data-i18n="prof_addr_set_default">Set Default</button>` : ''}
                                <button onclick="deleteAddress(${addr.id})" style="background: #fee2e2; color: #ef4444; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.85rem; transition: 0.2s;" onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'" data-i18n="prof_addr_delete">Delete</button>
                            </div>
                        </div>
                    `).join('');
                    
                    applyLanguage(currentLang);
                }
            } catch (err) { console.error("Lỗi tải địa chỉ:", err); }
        }

        document.getElementById("add-address-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("token");
            const address = document.getElementById("new-address-input").value.trim();
            const is_default = document.getElementById("address-list").children.length === 0 || document.getElementById("address-list").innerText.includes("Chưa có") || document.getElementById("address-list").innerText.includes("No addresses");
            
            try {
                const res = await fetch("http://localhost:3000/api/profile/addresses", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ address, is_default })
                });
                if (res.ok) {
                    document.getElementById("new-address-input").value = "";
                    fetchAddresses();
                }
            } catch (err) { alert("Lỗi thêm địa chỉ"); }
        });

        async function setDefaultAddress(id) {
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(`http://localhost:3000/api/profile/addresses/${id}/default`, {
                    method: "PUT",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) fetchAddresses();
            } catch (err) { console.error("Lỗi đặt mặc định"); }
        }

        async function deleteAddress(id) {
            if(!confirm(currentLang === 'vi' ? "Bạn có chắc chắn muốn xóa địa chỉ này?" : "Are you sure you want to delete this address?")) return;
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(`http://localhost:3000/api/profile/addresses/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) fetchAddresses();
            } catch (err) { console.error("Lỗi xóa địa chỉ"); }
        }
    </script>
</body>
</html>
