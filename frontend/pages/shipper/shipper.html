<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shipper Dashboard | Best Tech</title>
    <!-- Cập nhật Font Nunito chuẩn xác -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/client/shipper.css" />

    <!-- Leaflet Core & Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <h1 class="logo-area">
        <div class="logo-text">
          <span class="logo-blue">Best</span><span>Tech</span>
        </div>
        <span class="logo-divider">|</span>
        <div class="logo-app-name">
            <span id="app-logo-text">Shipper</span>
        </div>
      </h1>
      <div class="header-actions">
        <button id="lang-toggle" onclick="toggleLanguage()" class="btn-lang-toggle">
          <img id="lang-icon" src="https://flagcdn.com/w20/us.png" width="20" alt="lang" style="border-radius: 3px" />
          <span id="lang-text">EN</span>
        </button>
        <button class="btn-logout" onclick="logout()" id="btn-logout-text">Logout</button>
      </div>
    </header>

    <div class="container">
      
      <!-- ========================================== -->
      <!-- VIEW 1: DANH SÁCH TỔNG QUAN                -->
      <!-- ========================================== -->
      <div id="view-list">
        <h2 class="page-title" id="page-title-text">My Delivery Tasks</h2>
        
        <div class="tabs-container">
          <button class="tab-btn active" data-status="all" id="tab-all" onclick="setFilter('all')">All</button>
          <button class="tab-btn" data-status="shipping" id="tab-shipping" onclick="setFilter('shipping')">Delivering</button>
          <button class="tab-btn" data-status="completed" id="tab-completed" onclick="setFilter('completed')">Completed</button>
          <button class="tab-btn" data-status="cancelled" id="tab-cancelled" onclick="setFilter('cancelled')">Cancelled</button>
        </div>

        <div id="task-list" class="grid-container">
          <p class="loading-text" id="loading-text">Loading tasks...</p>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- VIEW 2: CHI TIẾT ĐƠN HÀNG                  -->
      <!-- ========================================== -->
      <div id="view-detail" style="display: none;">
        <button onclick="backToList()" class="btn-back">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          <span id="btn-back-text">Back to Tasks</span>
        </button>

        <div class="detail-card">
          <div class="detail-layout">
            
            <!-- CỘT TRÁI: BẢN ĐỒ -->
            <div class="map-column">
                <div class="map-header">
                    <span style="color: #ef4444;">📍</span> <span id="lbl-route-map">Route Map</span>
                </div>
                <div id="map-wrapper" class="map-wrapper"></div>
            </div>

            <!-- CỘT PHẢI: CHI TIẾT -->
            <div id="detail-info-container" class="info-column"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL CHỤP ẢNH MINH CHỨNG (POD)            -->
    <!-- ========================================== -->
    <div id="pod-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="pod-title" class="modal-title">Xác nhận đơn hàng</h3>
            <div class="modal-group">
                <label id="pod-img-label">📷 Chụp ảnh minh chứng (*):</label>
                <input type="file" id="pod-image" accept="image/*" capture="environment">
            </div>
            <div class="modal-group">
                <label id="pod-note-label">📝 Ghi chú / Lý do:</label>
                <textarea id="pod-note" rows="3" placeholder="Nhập nội dung..."></textarea>
            </div>
            <div class="modal-actions">
                <button onclick="closePodModal()" id="pod-btn-cancel" class="btn-pill btn-cancel">Hủy</button>
                <button onclick="submitPodData()" id="pod-submit-btn" class="btn-pill btn-confirm">Xác nhận & Gửi</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="/js/shipper/translate_shipper.js"></script>
    <script src="/js/shipper/shipper.js"></script>
  </body>
</html>
