<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shipper Dashboard | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet"/>
  
  <!-- LIÊN KẾT ĐẾN FILE CSS KÍNH MỜ VỪA TẠO -->
  <link rel="stylesheet" href="/css/client/shipper.css" />
</head>
<body>

  <header class="header">
    <!-- LOGO BESTTECH MỚI -->
    <h1 style="display: flex; align-items: center; gap: 12px; margin: 0;">
        <div style="font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; cursor: default;">
            <span style="color: var(--primary);">Best</span><span style="color: var(--text-main);">Tech</span>
        </div>
        <span style="color: #cbd5e1; font-weight: 300; font-size: 1.5rem; line-height: 1;">|</span>
        <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;">
            🚀 <span id="app-logo-text">Shipper</span>
        </div>
    </h1>
    
    <!-- CÁC NÚT CHỨC NĂNG BÊN PHẢI (Giữ nguyên) -->
    <div class="header-actions">
        <button id="lang-toggle" class="btn-lang" onclick="toggleLanguage()">
            <img id="lang-icon" src="https://flagcdn.com/w20/us.png" width="20" style="border-radius: 2px;"> 
            <span id="lang-text">EN</span>
        </button>
        <button class="btn-logout" onclick="logout()" id="btn-logout-text">Logout</button>
    </div>
  </header>

  <div class="container">
    <h2 class="page-title" id="page-title-text">My Delivery Tasks</h2>
    
    <!-- TABS BỘ LỌC ĐƠN HÀNG -->
    <div class="tabs-container">
        <button class="tab-btn active" data-status="all" id="tab-all" onclick="setFilter('all')">All</button>
        <button class="tab-btn" data-status="shipping" id="tab-shipping" onclick="setFilter('shipping')">Delivering</button>
        <button class="tab-btn" data-status="completed" id="tab-completed" onclick="setFilter('completed')">Completed</button>
        <button class="tab-btn" data-status="cancelled" id="tab-cancelled" onclick="setFilter('cancelled')">Cancelled</button>
    </div>

    <!-- DANH SÁCH ĐƠN HÀNG TRẢ VỀ TỪ JAVASCRIPT -->
    <div id="task-list">
      <p style="text-align: center; color: #64748b; font-weight: bold; margin-top: 50px;" id="loading-text">Loading tasks...</p>
    </div>
  </div>

  <!-- SCRIPT LOGIC (Giữ nguyên như bản cập nhật trước) -->
  <script>
    let currentLang = localStorage.getItem('besttech_lang') || 'en';

    const shipperDict = {
        en: {
            app_logo: "Shipper", logout: "Logout", page_title: "My Delivery Tasks",
            loading: "Loading tasks...", empty_title: "No orders found", empty_desc: "There are no orders matching this filter.",
            lbl_customer: "Customer Name", lbl_phone: "Phone Number", lbl_address: "Delivery Address",
            lbl_cod: "Total COD Amount:", btn_delivered: "✓ Delivered", btn_failed: "✕ Failed",
            confirm_msg: "Confirm changing status of order", alert_login: "Please log in!",
            err_load: "Error loading tasks.", err_server: "Server connection error.",
            tab_all: "All", tab_shipping: "Delivering", tab_completed: "Completed", tab_cancelled: "Cancelled"
        },
        vi: {
            app_logo: "Giao Hàng", logout: "Đăng xuất", page_title: "Nhiệm Vụ Của Tôi",
            loading: "Đang tải dữ liệu...", empty_title: "Trống", empty_desc: "Không có đơn hàng nào trong mục này.",
            lbl_customer: "Tên khách hàng", lbl_phone: "Số điện thoại", lbl_address: "Địa chỉ giao hàng",
            lbl_cod: "Tổng tiền thu hộ (COD):", btn_delivered: "✓ Đã giao", btn_failed: "✕ Thất bại",
            confirm_msg: "Xác nhận chuyển trạng thái đơn", alert_login: "Vui lòng đăng nhập!",
            err_load: "Lỗi tải danh sách đơn hàng.", err_server: "Lỗi kết nối đến máy chủ.",
            tab_all: "Tất cả", tab_shipping: "Chưa giao", tab_completed: "Đã giao", tab_cancelled: "Đã hủy"
        }
    };

    function applyLanguage() {
        const t = shipperDict[currentLang];
        document.getElementById('app-logo-text').innerText = t.app_logo;
        document.getElementById('btn-logout-text').innerText = t.logout;
        document.getElementById('page-title-text').innerText = t.page_title;
        document.getElementById('tab-all').innerText = t.tab_all;
        document.getElementById('tab-shipping').innerText = t.tab_shipping;
        document.getElementById('tab-completed').innerText = t.tab_completed;
        document.getElementById('tab-cancelled').innerText = t.tab_cancelled;
        if(document.getElementById('loading-text')) document.getElementById('loading-text').innerText = t.loading;

        const langIcon = document.getElementById('lang-icon');
        const langText = document.getElementById('lang-text');
        if (currentLang === 'vi') {
            langIcon.src = "https://flagcdn.com/w20/vn.png";
            langText.innerText = "VI";
        } else {
            langIcon.src = "https://flagcdn.com/w20/us.png";
            langText.innerText = "EN";
        }
        renderTasks(); 
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'vi' : 'en';
        localStorage.setItem('besttech_lang', currentLang);
        applyLanguage();
    }

    const token = localStorage.getItem("token");
    if (!token) {
        alert(shipperDict[currentLang].alert_login);
        window.location.href = "/pages/user/login.html";
    }

    let allOrdersCache = []; 
    let currentFilter = 'all';

    function logout() {
        localStorage.removeItem("token");
        window.location.href = "/pages/user/login.html";
    }

    function setFilter(status) {
        currentFilter = status;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-status') === status) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderTasks(); 
    }

    async function fetchTasks() {
        const t = shipperDict[currentLang];
        try {
            const res = await fetch("http://localhost:3000/api/shipper/orders", {
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (!res.ok) throw new Error("Failed to load");
            allOrdersCache = await res.json();
            renderTasks();
        } catch (error) {
            document.getElementById("task-list").innerHTML = `<p style="color: red; text-align: center; font-weight: bold;">${t.err_load}</p>`;
        }
    }

    function renderTasks() {
        const listEl = document.getElementById("task-list");
        const t = shipperDict[currentLang];

        const displayOrders = currentFilter === 'all' 
            ? allOrdersCache 
            : allOrdersCache.filter(order => order.status === currentFilter);

        if (displayOrders.length === 0) {
            listEl.innerHTML = `
            <div style="text-align: center; padding: 50px 20px; background: var(--glass-bg); border-radius: 20px; border: 2px dashed #cbd5e1; box-shadow: var(--glass-shadow);">
                <span style="font-size: 3.5rem; opacity: 0.5;">📭</span>
                <h3 style="color: #475569; margin: 15px 0 5px 0;">${t.empty_title}</h3>
                <p style="color: #94a3b8; font-size: 0.95rem; margin: 0;">${t.empty_desc}</p>
            </div>`;
            return;
        }

        listEl.innerHTML = displayOrders.map(order => {
            const isShipping = order.status === 'shipping';
            return `
            <div class="task-card">
                <div class="task-header">
                    <span class="task-id">#${order.id}</span>
                    <span class="badge ${order.status}">${order.status}</span>
                </div>
                <div class="detail-row">
                    <div class="detail-icon">👤</div>
                    <div class="detail-content">
                        <div class="detail-label">${t.lbl_customer}</div>
                        <div class="detail-value">${order.full_name}</div>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon">📞</div>
                    <div class="detail-content">
                        <div class="detail-label">${t.lbl_phone}</div>
                        <a href="tel:${order.phone}" class="detail-value phone-link">${order.phone}</a>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-icon">📍</div>
                    <div class="detail-content">
                        <div class="detail-label">${t.lbl_address}</div>
                        <div class="detail-value">${order.shipping_address}</div>
                    </div>
                </div>
                <div class="cod-amount">
                    <span>${t.lbl_cod}</span>
                    <strong>$${order.total_amount}</strong>
                </div>
                ${isShipping ? `
                <div class="actions">
                    <button class="btn btn-success" onclick="updateStatus(${order.id}, 'completed')">${t.btn_delivered}</button>
                    <button class="btn btn-danger" onclick="updateStatus(${order.id}, 'cancelled')">${t.btn_failed}</button>
                </div>
                ` : ''}
            </div>
            `;
        }).join('');
    }

    async function updateStatus(orderId, newStatus) {
        const t = shipperDict[currentLang];
        if (!confirm(`${t.confirm_msg} #${orderId} ➔ ${newStatus.toUpperCase()}?`)) return;
        
        try {
            const res = await fetch(`http://localhost:3000/api/shipper/orders/${orderId}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ status: newStatus })
            });
            const data = await res.json();
            if (res.ok) fetchTasks(); 
            else alert("Error: " + data.error);
        } catch (error) { alert(t.err_server); }
    }

    applyLanguage();
    fetchTasks();
  </script>
</body>
</html>
