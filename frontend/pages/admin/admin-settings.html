<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Best Tech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/admin/admin.css" />
  </head>
  <body>
    <!-- SIDEBAR  -->
    <aside class="sidebar">
      <h2
        onclick="window.location.href = '/index.html'"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          cursor: pointer;
        "
        title="Quay về Trang chủ"
      >
        <div
          style="font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px"
        >
          <span style="color: #3b82f6">Best</span
          ><span style="color: #ffffff">Tech</span>
        </div>
        <span
          style="
            color: #475569;
            font-weight: 300;
            font-size: 1.5rem;
            line-height: 1;
          "
          >|</span
        >
        <div
          style="
            font-size: 0.95rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
          "
        >
          👑 Admin
        </div>
      </h2>

      <!-- Menu -->
      <nav>
        <ul>
          <li>
            <a href="/pages/admin/admin.html" data-i18n="menu_add"
              >+ Add New Product</a
            >
          </li>
          <li>
            <a href="/pages/admin/admin-orders.html" data-i18n="menu_orders"
              >Order Management</a
            >
          </li>
          <li>
            <a
              href="/pages/admin/admin-customers.html"
              data-i18n="menu_customers"
              >Customer List</a
            >
          </li>
          <li>
            <a
              href="/pages/admin/admin-settings.html"
              class="active"
              data-i18n="menu_settings"
              >System Settings</a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="header-bar">
        <h1 data-i18n="menu_settings">System Settings</h1>
        <div style="display: flex; gap: 15px; align-items: center">
          <button
            id="lang-toggle"
            onclick="toggleAdminLang()"
            style="
              background: #e2e8f0;
              border: none;
              padding: 8px 15px;
              border-radius: 12px;
              font-weight: 800;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 8px;
              color: #0f172a;
              transition: 0.2s;
            "
            onmouseover="this.style.background = '#cbd5e1'"
            onmouseout="this.style.background = '#e2e8f0'"
          >
            <img
              id="admin-lang-icon"
              src="https://flagcdn.com/w20/us.png"
              width="20"
              style="border-radius: 2px"
            />
            <span id="admin-lang-text">EN</span>
          </button>
          <!-- Đã khôi phục nút Log Out -->
          <button class="logout-btn" onclick="logout()" data-i18n="logout">
            Log Out
          </button>
        </div>
      </div>

      <!-- KHU VỰC CHỨA CÁC MODULE CÀI ĐẶT -->
      <div
        class="settings-container"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
          gap: 25px;
        "
      >
        <!-- 1. MODULE: FLASH SALE SETTINGS -->
        <div
          class="card"
          style="
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 0;
          "
        >
          <h3
            style="
              margin-top: 0;
              color: #0046be;
              border-bottom: 2px solid #f0f4fc;
              padding-bottom: 12px;
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            ⚡ <span data-i18n="set_flash_title">Deal of the Day</span>
          </h3>
          <p
            style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px"
            data-i18n="set_flash_desc"
          >
            Cài đặt thời gian đếm ngược cho banner khuyến mãi ngoài trang chủ.
          </p>

          <div style="display: flex; flex-direction: column; gap: 15px">
            <label
              style="font-weight: 600; color: #1e293b"
              data-i18n="set_flash_endtime"
              >Select End Time:</label
            >
            <input
              type="datetime-local"
              id="admin-flash-sale-time"
              style="
                padding: 12px 15px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                font-size: 1rem;
                outline: none;
                width: 100%;
                transition: border-color 0.2s;
              "
            />

            <!-- Tái sử dụng key btn_save_changes từ trang Edit Product -->
            <button
              onclick="updateFlashSaleTime()"
              style="
                background: #ffe000;
                color: #000;
                padding: 14px;
                font-weight: 800;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
                box-shadow: 0 4px 10px rgba(255, 224, 0, 0.3);
                margin-top: 10px;
              "
              data-i18n="btn_save_changes"
            >
              Save Changes
            </button>

            <label
              style="margin-left: 15px; font-weight: bold; cursor: pointer"
            >
              <input
                type="checkbox"
                id="admin-flash-sale-active"
                style="transform: scale(1.2); margin-right: 5px"
              />
              <span data-i18n="set_flash_active">Kích hoạt Flash Sale</span>
            </label>
          </div>
        </div>

        <!-- 2. MODULE: SHIPPING & DELIVERY -->
        <div
          class="card"
          style="
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 0;
          "
        >
          <h3
            style="
              margin-top: 0;
              color: #0046be;
              border-bottom: 2px solid #f0f4fc;
              padding-bottom: 12px;
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            🚚 <span data-i18n="set_ship_title">Shipping & Delivery</span>
          </h3>
          <p
            style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px"
            data-i18n="set_ship_desc"
          >
            Cấu hình phí giao hàng tiêu chuẩn và định mức miễn phí vận chuyển.
          </p>

          <div style="display: flex; flex-direction: column; gap: 15px">
            <div>
              <label
                style="
                  font-weight: 600;
                  color: #1e293b;
                  display: block;
                  margin-bottom: 5px;
                "
                data-i18n="set_ship_base"
                >Base Shipping Fee ($):</label
              >
              <input
                type="number"
                id="admin-ship-base"
                step="0.01"
                min="0"
                style="
                  padding: 12px 15px;
                  border: 1px solid #cbd5e1;
                  border-radius: 8px;
                  font-size: 1rem;
                  outline: none;
                  width: 100%;
                  transition: border-color 0.2s;
                "
                placeholder="Ex: 15.00"
              />
            </div>

            <div>
              <label
                style="
                  font-weight: 600;
                  color: #1e293b;
                  display: block;
                  margin-bottom: 5px;
                "
                data-i18n="set_ship_free"
                >Free Shipping Threshold ($):</label
              >
              <input
                type="number"
                id="admin-ship-free"
                step="0.01"
                min="0"
                style="
                  padding: 12px 15px;
                  border: 1px solid #cbd5e1;
                  border-radius: 8px;
                  font-size: 1rem;
                  outline: none;
                  width: 100%;
                  transition: border-color 0.2s;
                "
                placeholder="Ex: 1000.00"
              />
            </div>

            <button
              onclick="updateShippingSettings()"
              style="
                background: #ffe000;
                color: #000;
                padding: 14px;
                font-weight: 800;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
                box-shadow: 0 4px 10px rgba(255, 224, 0, 0.3);
                margin-top: 10px;
              "
              data-i18n="btn_save_changes"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/admin/translate_admin.js?v=3"></script>
    <script src="/js/admin/admin.js"></script>
  </body>
</html>
