<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin/admin.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 style="margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
      <a href="/index.html" style="color: #ffe000; text-decoration: none;">BestTech Admin</a>
    </h2>
    <ul class="menu">
      <li>
        <a href="admin.html" style="color: inherit; text-decoration: none; display: block;">+ Add New Product</a>
      </li>
      <li>
        <a href="admin-orders.html" style="color: inherit; text-decoration: none; display: block;">Order Management</a>
      </li>
      <li>
        <a href="admin-customers.html" style="color: inherit; text-decoration: none; display: block;">Customer List</a>
      </li>
      <li style="color: #ffe000; font-weight: bold;">
        <a href="admin-settings.html" style="color: inherit; text-decoration: none; display: block;">System Settings</a>
      </li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="header-bar">
      <h1>System Settings</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <!-- KHU VỰC CHỨA CÁC MODULE CÀI ĐẶT (Sử dụng Grid để xếp thẻ tự động) -->
    <div class="settings-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px;">
        
        <!-- 1. MODULE: FLASH SALE SETTINGS -->
        <div class="card" style="background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 0;">
          <h3 style="margin-top: 0; color: #0046be; border-bottom: 2px solid #f0f4fc; padding-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            ⚡ Deal of the Day
          </h3>
          <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Cài đặt thời gian đếm ngược cho banner khuyến mãi ngoài trang chủ.</p>
          
          <div style="display: flex; flex-direction: column; gap: 15px;">
              <label style="font-weight: 600; color: #1e293b;">Select End Time:</label>
              <input type="datetime-local" id="admin-flash-sale-time" style="padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; width: 100%; transition: border-color 0.2s;">
              
              <button onclick="updateFlashSaleTime()" style="background: #ffe000; color: #000; padding: 14px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(255, 224, 0, 0.3); margin-top: 10px;">
                Save Changes
              </button>
          </div>
        </div>

        <!-- Các Module cài đặt khác trong tương lai (Ví dụ: Banner, Phí Ship) sẽ được thêm vào đây, Grid sẽ tự động xếp chúng nằm ngang hàng với Flash Sale -->

    </div>
  </main>

  <script src="/js/admin/admin.js"></script>
</body>
</html>
