<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Best Tech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/admin/admin.css" />
  </head>
  <body>
    <!-- SIDEBAR  -->
    <aside class="sidebar">
      <h2
        onclick="window.location.href = '/index.html'"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          cursor: pointer;
        "
        title="Quay về Trang chủ"
      >
        <div
          style="font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px"
        >
          <span style="color: #3b82f6">Best</span
          ><span style="color: #ffffff">Tech</span>
        </div>
        <span
          style="
            color: #475569;
            font-weight: 300;
            font-size: 1.5rem;
            line-height: 1;
          "
          >|</span
        >
        <div
          style="
            font-size: 0.95rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
          "
        >
          👑 Admin
        </div>
      </h2>

      <!-- Menu -->
      <nav>
        <ul>
          <li>
            <a href="/pages/admin/admin.html" data-i18n="menu_add"
              >+ Add New Product</a
            >
          </li>
          <li>
            <a href="/pages/admin/admin-orders.html" data-i18n="menu_orders"
              >Order Management</a
            >
          </li>
          <li>
            <a
              href="/pages/admin/admin-customers.html"
              class="active"
              data-i18n="menu_customers"
              >Customer List</a
            >
          </li>
          <li>
            <a href="/pages/admin/admin-settings.html" data-i18n="menu_settings"
              >System Settings</a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="header-bar">
        <h1 data-i18n="menu_customers">Customer List</h1>
        <div style="display: flex; gap: 15px; align-items: center">
          <button
            id="lang-toggle"
            onclick="toggleAdminLang()"
            style="
              background: #e2e8f0;
              border: none;
              padding: 8px 15px;
              border-radius: 12px;
              font-weight: 800;
              cursor: pointer;
              display: flex;
              align-items: center;
              gap: 8px;
              color: #0f172a;
              transition: 0.2s;
            "
            onmouseover="this.style.background = '#cbd5e1'"
            onmouseout="this.style.background = '#e2e8f0'"
          >
            <img
              id="admin-lang-icon"
              src="https://flagcdn.com/w20/us.png"
              width="20"
              style="border-radius: 2px"
            />
            <span id="admin-lang-text">EN</span>
          </button>

          <button class="logout-btn" onclick="logout()" data-i18n="logout">
            Log Out
          </button>
        </div>
      </div>

      <div class="card" style="max-width: 100%">
        <p style="color: #666" data-i18n="cust_subtitle">
          The list of customers who have registered an account will be displayed
          here...
        </p>
        <div id="admin-customer-list"></div>
      </div>
    </main>

    <script src="/js/admin/translate_admin.js?v=2"></script>
    <script src="/js/admin/admin.js"></script>
  </body>
</html>
