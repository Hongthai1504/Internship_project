<!-- NÚT TOGGLE CHATBOT NỔI -->
<div id="chatbot-toggle" style="position: fixed; bottom: 35px; right: 35px; width: 65px; height: 65px; background: linear-gradient(135deg, #0046be, #3b82f6); border-radius: 50%; box-shadow: 0 10px 25px rgba(0,70,190,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    <svg width="32" height="32" fill="white" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
</div>

<!-- CỬA SỔ CHATBOT (KÍNH MỜ) -->
<div id="chatbot-window" style="display: none; position: fixed; bottom: 120px; right: 35px; width: 380px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.6); z-index: 10000; flex-direction: column; overflow: hidden; font-family: 'Nunito', sans-serif; animation: slideUp 0.3s ease-out forwards;">
    
    <!-- Header Gradient -->
    <div style="background: linear-gradient(135deg, #0046be, #001e50); padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.3rem;">🤖</div>
            <div style="display: flex; flex-direction: column;">
                <strong style="font-size: 1.1rem; letter-spacing: 0.5px;">BestTech AI</strong>
                <span style="font-size: 0.75rem; color: #93c5fd; display: flex; align-items: center; gap: 4px;"><span style="width:6px; height:6px; background:#10b981; border-radius:50%; display:inline-block;"></span> Đang trực tuyến</span>
            </div>
        </div>
        <button id="chatbot-close" style="background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1.8rem; cursor: pointer; transition: 0.2s; line-height: 1;" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">&times;</button>
    </div>
    
    <!-- Vùng tin nhắn -->
    <div id="chatbot-messages" style="flex: 1; height: 380px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; background: #f8fafc;">
        <!-- Tin nhắn chào mừng tự động -->
        <div style="align-self: flex-start; background: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; padding: 14px 18px; border-radius: 20px 20px 20px 4px; max-width: 85%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); font-size: 0.95rem; line-height: 1.5;">
            👋 Xin chào! Tôi là trợ lý AI ảo của BestTech. Tôi có thể giúp gì cho bạn hôm nay?
        </div>
    </div>

    <!-- Vùng nhập chat -->
    <form id="chatbot-form" style="display: flex; padding: 15px 20px; background: white; border-top: 1px solid #f1f5f9; gap: 10px; align-items: center;">
        <input type="text" id="chatbot-input" placeholder="Nhập câu hỏi của bạn..." autocomplete="off" style="flex: 1; padding: 14px 20px; border: 1px solid #e2e8f0; border-radius: 50px; outline: none; font-size: 0.95rem; font-family: inherit; background: #f8fafc; transition: all 0.3s;" onfocus="this.style.borderColor='#0046be'; this.style.background='#fff'">
        
        <button type="submit" style="background: linear-gradient(135deg, #ffe000, #ffc107); border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(255,193,7,0.3); transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
            <svg width="18" height="18" fill="#000" viewBox="0 0 24 24" style="transform: translateX(2px);"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </form>
</div>

<style>
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
