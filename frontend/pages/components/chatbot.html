<!-- AI CHATBOT UI -->
    <div id="chatbot-container" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999;">
        <!-- Floating Button -->
        <button id="chatbot-toggle" style="width: 60px; height: 60px; border-radius: 50%; background: #0046be; color: white; border: none; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s;">
            💬
        </button>

        <!-- Chat Window (Hidden by default) -->
        <div id="chatbot-window" style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 450px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #e0e6ef;">
            <!-- Header -->
            <div style="background: #0046be; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                <span>Best Tech Assistant 🤖</span>
                <button id="chatbot-close" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">&times;</button>
            </div>
            
            <!-- Message List -->
            <div id="chatbot-messages" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9fafb; font-size: 0.95rem; line-height: 1.5;">
                <!-- Default greeting -->
                <div style="background: #eef2f7; color: #040c13; padding: 10px 15px; border-radius: 15px 15px 15px 0; max-width: 80%; align-self: flex-start;">
                    Hello! I'm the Best Tech virtual assistant. How can I help you today?
                </div>
            </div>

            <!-- Input Area -->
            <form id="chatbot-form" style="display: flex; border-top: 1px solid #eee; padding: 10px; background: #fff; gap: 10px;">
                <input type="text" id="chatbot-input" placeholder="Type your message..." required style="flex: 1; padding: 10px; border: 1px solid #c8c8c8; border-radius: 20px; outline: none;">
                <button type="submit" style="background: #ffe000; color: #000; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; cursor: pointer;">Send</button>
            </form>
        </div>
    </div>
