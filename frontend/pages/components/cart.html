<!-- CART DRAWER -->
    <div id="cart-drawer" class="cart-drawer">
      <div class="drawer-header">
        <h2>Cart</h2>
        <button id="close-cart" class="close-btn">&times;</button>
      </div>
      <div class="drawer-body"><ul id="cart-items"></ul></div>
      <div class="drawer-footer">
        <div class="cart-summary" style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;">
          <span>Total</span>
          <span class="total-amount" style="color: #0046be;">$<span id="cart-total">0</span></span>
        </div>
        <button onclick="goToCheckout()" class="btn-checkout" style="width: 100%; padding: 15px; background: #ffe000; color: #000; font-weight: bold; font-size: 1.1rem; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s;">
          Proceed to Checkout
        </button>
      </div>
    </div>
