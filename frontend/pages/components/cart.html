<div id="cart-drawer" class="cart-drawer" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-left: 1px solid rgba(255,255,255,0.5); box-shadow: -10px 0 40px rgba(0,0,0,0.05); display: flex; flex-direction: column;">
    
    <!-- HEADER -->
    <div class="cart-header" style="padding: 25px 30px; background: transparent; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.6rem; font-weight: 900; color: #0f172a; display: flex; align-items: center; gap: 10px;" data-i18n="cart_title">
            <svg width="24" height="24" fill="#0046be" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Giỏ hàng
        </h2>
        <button id="close-cart" style="background: #f1f5f9; border: none; color: #64748b; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#e2e8f0'; this.style.color='#0f172a'">&times;</button>
    </div>
    
    <!-- BODY -->
    <div class="cart-body" style="padding: 20px 30px; flex: 1; overflow-y: auto;">
        <ul id="cart-items" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 15px;">
            <!-- JS sẽ tự động đổ sản phẩm vào đây -->
        </ul>
    </div>
    
    <!-- FOOTER -->
    <div class="cart-footer" style="padding: 30px; background: #ffffff; border-top: 1px solid rgba(0,0,0,0.05); border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.03);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <span style="font-weight: 800; color: #64748b; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;" data-i18n="cart_total">Tổng cộng</span>
            <span id="cart-total" style="font-weight: 900; color: #0046be; font-size: 1.8rem;">$0.00</span>
        </div>
        <button onclick="goToCheckout()" style="width: 100%; background: linear-gradient(135deg, #ffe000 0%, #ffc107 100%); color: #000; font-weight: 900; font-size: 1.2rem; padding: 18px; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 193, 7, 0.3); transition: all 0.3s ease;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 12px 25px rgba(255, 193, 7, 0.4)'" onmouseout="this.style.transform='none'; this.style.boxShadow='0 8px 20px rgba(255, 193, 7, 0.3)'" data-i18n="cart_checkout">
            Tiến hành thanh toán
        </button>
    </div>
</div>
