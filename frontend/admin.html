<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>BestTech Admin</h2>
    <ul class="menu">
      <li style="color: #ffe000; font-weight: bold;">+ Add New Product</li>
      <li>Order Management</li>
      <li>Customer List</li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="header-bar">
      <h1>Add New Product</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <div class="card">
      <form id="add-product-form">
        <div class="form-row">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="name" required placeholder="e.g., MacBook Pro 16">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category_id" required>
              <option value="1">Computers & Tablets</option>
              <option value="2">Cell Phones</option>
              <option value="3">Audio</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Brand</label>
            <input type="text" id="brand" placeholder="e.g., Apple">
          </div>
          <div class="form-group">
            <label>SKU (Must be unique) *</label>
            <input type="text" id="sku" required placeholder="e.g., MAC-16-M3">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Price ($) *</label>
            <input type="number" id="price" step="0.01" required placeholder="1999.99">
          </div>
          <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" id="stock" value="0" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>Product Image</label>
          <input type="file" id="image_file" accept="image/*">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="4" placeholder="Enter product details..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Save Product</button>
      </form>
    </div>
  </main>

  <!-- logic JS -->
  <script src="admin.js"></script>
</body>
</html>
