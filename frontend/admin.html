<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Best Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* CSS for Admin */
    body { margin: 0; font-family: 'Roboto', sans-serif; background: #f4f6f9; display: flex; height: 100vh; }
    .sidebar { width: 250px; background: #001e50; color: white; padding: 20px; }
    .sidebar h2 { margin-top: 0; color: #ffe000; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .menu { list-style: none; padding: 0; }
    .menu li { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    .menu li:hover { color: #ffe000; }
    
    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 800px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #c8c8c8; border-radius: 4px; font-family: inherit; }
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    
    .btn-submit { background: #0046be; color: white; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1.1rem; }
    .btn-submit:hover { background: #003399; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>BestTech Admin</h2>
    <ul class="menu">
      <li style="color: #ffe000; font-weight: bold;">+ Add New Product</li>
      <li>Order Management</li>
      <li>Customer List</li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="header-bar">
      <h1>Add New Product</h1>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <div class="card">
      <form id="add-product-form">
        <div class="form-row">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="name" required placeholder="e.g., MacBook Pro 16">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="category_id" required>
              <option value="1">Computers & Tablets</option>
              <option value="2">Cell Phones</option>
              <option value="3">Audio</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Brand</label>
            <input type="text" id="brand" placeholder="e.g., Apple">
          </div>
          <div class="form-group">
            <label>SKU (Must be unique) *</label>
            <input type="text" id="sku" required placeholder="e.g., MAC-16-M3">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Price ($) *</label>
            <input type="number" id="price" step="0.01" required placeholder="1999.99">
          </div>
          <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" id="stock" value="0" min="0">
          </div>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="image_url" placeholder="http://localhost:3000/images/macbook.png">
          <small style="color: #666; margin-top: 5px; display: block;">* Temporary: Enter direct link. Multer file upload can be added later.</small>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="4" placeholder="Enter product details..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Save Product</button>
      </form>
    </div>
  </main>

  <!-- logic JS -->
  <script src="admin.js"></script>
</body>
</html>
